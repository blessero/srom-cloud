<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontaktówka</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --mute:#6b6862; --line:#dedad2; --hl:#fff4c2;
          --A:#2f7d4f; --B:#3b6fb0; --C:#8a6d1e; --D:#b0563b; --E:#7a4fa0; --F:#555;
          --P1:#1f9d55; --P2:#e0a200; --PX:#8a857c;
          --col:420px; --imgh:440px; --rpw:min(720px, 46vw); }
  :root.L { --col:640px; --imgh:680px; }
  :root.S { --col:260px; --imgh:240px; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --card:#21201d; --ink:#ecebe6; --mute:#a19d94; --line:#34322d; --hl:#3a3420; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, "Helvetica Neue", sans-serif; }
  header { padding:20px 24px 8px; display:flex; gap:16px; align-items:flex-start; }
  header .hd { flex:1; min-width:0; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--mute); }
  nav { padding:0 24px 8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  nav button, header button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px; padding:3px 10px; cursor:pointer; font:inherit; }
  nav button.on { border-color:var(--ink); } nav .gap { width:14px; }
  nav .lbl { color:var(--mute); font-size:12.5px; margin-right:2px; }
  header button.rec { white-space:nowrap; padding:5px 12px; }
  section { padding:8px 24px 16px; }
  h2 { font-size:19px; margin:16px 0 4px; line-height:1.3; } h2 small { color:var(--mute); font-weight:400; font-size:17px; }
  h2 .pc { font-size:13px; font-weight:400; margin-left:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(var(--col), 100%), 1fr)); gap:16px; margin-top:8px; }
  .c { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  .c img { width:100%; height:var(--imgh); object-fit:contain; background:#00000010; display:block; cursor:zoom-in; }
  .c .b { padding:8px 10px 10px; display:flex; flex-direction:column; gap:3px; }
  .top { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .id { font-weight:600; } .t { font-style:italic; } .m { color:var(--mute); font-size:12.5px; }
  .why { font-size:13px; margin-top:3px; }
  .mt { font-size:12.5px; margin-top:3px; color:var(--mute); }
  .alt, .also { font-size:12.5px; background:var(--hl); border-radius:4px; padding:2px 6px; margin-top:3px; }
  .cls { display:inline-block; color:#fff; border-radius:4px; padding:0 6px; font-size:12px; font-weight:600; margin-right:4px; }
  .cp { border:0; background:none; color:var(--mute); cursor:pointer; padding:0 3px; font-size:12px; }
  a { color:inherit; }
  /* selection (MB 21.11.2026): 1 = główne (green), 2 = dodatkowe (amber), x = archiwum; rec = the ikonograf's proposal */
  .pk { margin-left:auto; display:inline-flex; gap:3px; }
  .pk button { border:1px solid var(--line); background:var(--card); color:var(--mute); border-radius:12px; padding:0 8px; font-size:12px; line-height:20px; cursor:pointer; }
  .pk button .dot, .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:0; }
  .dot.p1 { background:var(--P1); } .dot.p2 { background:var(--P2); }
  .pk button.on.p1 { background:var(--P1); border-color:var(--P1); color:#fff; } .pk button.on.p1 .dot { background:#fff; }
  .pk button.on.p2 { background:var(--P2); border-color:var(--P2); color:#1d1d1b; } .pk button.on.p2 .dot { background:#1d1d1b; }
  .pk button.on.px { background:var(--PX); border-color:var(--PX); color:#fff; }
  .c.p1 { border:2px solid var(--P1); } .c.p2 { border:2px solid var(--P2); } .c.px { opacity:.75; }
  .recn { font-size:12px; color:var(--mute); }
  .recn .dot { width:8px; height:8px; }
  #lb { position:fixed; inset:0; background:#000e; display:none; flex-direction:column; align-items:center; justify-content:center; gap:6px; z-index:9; }
  #lb.on { display:flex; } #lb .im { max-width:calc(100vw - 260px); max-height:76vh; object-fit:contain; background:#fff; cursor:zoom-out; }
  #lb .cap { color:#eee; font-size:14.5px; max-width:min(900px, 92vw); text-align:center; display:flex; flex-direction:column; gap:3px; }
  #lb .cap .ti { font-size:16px; } #lb .cap .ti i { font-style:italic; } #lb .cap .m { color:#bbb; }
  #lb a { color:#fff; } #lb .cp { color:#bbb; }
  #lb .pk { margin:4px auto 0; } #lb .pk button:not(.on) { background:#2a2a28; border-color:#555; color:#ddd; } #lb .pk button { font-size:13px; line-height:24px; padding:0 10px; }
  #lb .nx { position:fixed; top:50%; transform:translateY(-50%); background:none; border:0; cursor:pointer; padding:10px; opacity:.85; }
  #lb .nx:hover { opacity:1; } #lb .nx img { width:110px; display:block; }
  #lb .nx.l { left:8px; } #lb .nx.r { right:8px; } #lb .nx[disabled] { opacity:.15; cursor:default; }
  #lb .pos { position:fixed; top:10px; right:16px; color:#aaa; font-size:12.5px; }
  @media (max-width:700px) { #lb .im { max-width:96vw; } #lb .nx { top:auto; bottom:6px; transform:none; } #lb .nx img { width:64px; } }
  /* rights flag, key, hints, § notes, jumps (MB 09.11.2026) */
  .rflag { display:inline-block; font-size:11.5px; font-weight:600; border:1px solid currentColor; border-radius:4px; padding:0 5px; margin-left:6px; color:var(--D); }
  .rflag.E { color:var(--E); } .rflag.F { color:var(--F); } .rflag.C { color:var(--C); }
  .c.need { box-shadow:inset 4px 0 0 var(--D); } .c.need.E { box-shadow:inset 4px 0 0 var(--E); } .c.need.F { box-shadow:inset 4px 0 0 var(--F); } .c.need.C { box-shadow:inset 4px 0 0 var(--C); }
  nav button .cls { margin-right:5px; } nav button small { color:var(--mute); margin-left:3px; }
  #key { padding:0 24px 6px; color:var(--mute); font-size:12.5px; }
  .hint { font-size:12.5px; border-left:3px solid var(--line); padding:1px 0 1px 7px; margin-top:4px; }
  button.sec, a.jump { border:0; background:none; padding:0; font:inherit; color:var(--B); cursor:pointer; text-decoration:underline dotted; }
  .c.flash { outline:3px solid var(--B); outline-offset:2px; }
  #np { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; z-index:10; }
  #np.on { display:flex; }
  #np .box { background:var(--card); color:var(--ink); width:min(760px, 94vw); max-height:84vh; overflow:auto; border-radius:8px; padding:12px 18px 16px; font-size:13.5px; }
  #np ul { padding-left:18px; margin:6px 0; } #np li { margin:5px 0; } #np li.hit { background:var(--hl); border-radius:4px; padding:2px 5px; list-style-position:inside; }
  #np summary { cursor:pointer; color:var(--mute); margin-top:8px; }
  /* the record panel: ikonografia.md beside the sheet (MB 21.11.2026) */
  #rp { position:fixed; top:0; right:0; bottom:0; width:var(--rpw); background:var(--card); border-left:1px solid var(--line); z-index:8; display:none; flex-direction:column; box-shadow:-6px 0 18px #0002; }
  body.rp main, body.rp nav, body.rp #key, body.rp header { margin-right:var(--rpw); }
  body.rp #rp { display:flex; }
  #rp .rh { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  #rp .rh b { flex:1; } #rp .rh button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:2px 10px; cursor:pointer; }
  #rp .toc { padding:6px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12.5px; }
  #rp .toc a { color:var(--B); text-decoration:none; } #rp .toc a.l3 { color:var(--mute); }
  #rp .rb { overflow:auto; padding:6px 20px 40px; font-size:13.5px; line-height:1.5; }
  #rp .rb h1 { font-size:18px; margin:10px 0; } #rp .rb h2 { font-size:16.5px; margin:22px 0 6px; padding-top:6px; border-top:1px solid var(--line); }
  #rp .rb h3 { font-size:14.5px; margin:16px 0 4px; }
  #rp .rb code { font-size:12px; background:#00000010; border-radius:3px; padding:0 3px; word-break:break-all; }
  #rp .rb pre { overflow:auto; background:#00000010; padding:8px; border-radius:4px; }
  #rp .rb .tw { overflow-x:auto; margin:8px 0; }
  #rp .rb table { border-collapse:collapse; font-size:12.5px; }
  #rp .rb th, #rp .rb td { border:1px solid var(--line); padding:3px 6px; vertical-align:top; text-align:left; }
  #rp .rb th { background:#00000008; }
  #rp .rb blockquote { margin:6px 0; padding-left:10px; border-left:3px solid var(--line); color:var(--mute); }
  #rp .rb li { margin:3px 0; } #rp .rb a { color:var(--B); word-break:break-word; }
  #rp .rb .fl { background:var(--hl); border-radius:3px; }
  #rp .rb h3 { font-size:14.5px; margin:14px 0 2px; } #rp .rb h4 { font-size:13.5px; margin:10px 0 2px; }
  #rp .rb .lg { color:var(--mute); font-size:12px; } #rp .rb .sm { margin:0 0 2px; font-size:12.5px; color:var(--mute); }
  #rp .rb .ty { margin-right:3px; } #rp .rb .an { border:1px solid var(--line); border-radius:8px; padding:0 6px; margin-right:6px; font-size:11.5px; }
  #rp .rb .psg { font-style:italic; }
  #rp .rb ul.cand { list-style:none; padding-left:4px; margin:2px 0 6px; } #rp .rb ul.cand li { margin:1px 0; font-size:13px; }
  #rp .rb ul.cand .dot { width:8px; height:8px; margin-right:6px; }
  #rp .grip { position:absolute; left:-5px; top:0; bottom:0; width:10px; cursor:col-resize; z-index:1; touch-action:none; }
  #rp .grip:hover, #rp .grip.on { background:var(--B); opacity:.35; }
  @media (max-width:900px) { :root { --rpw:100vw; } body.rp main, body.rp nav, body.rp #key, body.rp header { margin-right:0; } }
</style>
</head>
<body>
<header><div class="hd"><h1 id="h"></h1><div class="sub" id="s"></div></div><button class="rec" id="rbtn" title="ikonografia.md: brief, kandydaci, rejestr, zgody, wyszukiwania, wątpliwości">📄 Zapis (ikonografia.md)</button></header>
<nav id="f"></nav>
<nav id="f2"></nav>
<div id="key"></div>
<main id="out"></main>
<div id="lb"></div>
<div id="np"><div class="box"></div></div>
<aside id="rp"><div class="grip" id="grip" title="Przeciągnij, by zmienić szerokość"></div><div class="rh"><b>ikonografia.md</b><button id="rclose">zamknij ✕</button></div><div class="toc" id="rtoc"></div><div class="rb" id="rbody"></div></aside>
<script>
/* Built by scripts/kontaktowka_build.py from kontaktowka.json (edit that file, then build; never this block by hand).
   One object per candidate; slot ids match ikonografia.md § 1.
   thumb: about 700 px wide (SKILL.md step 5, sources.md § Thumbnails); a local copy is "miniatury/<id>.jpg",
   embedded at the end of this file (sources.md § Thumbnails).
   alt (optional): better copies, each {label, url, why}: why in a few words (larger scan, the original's holder
   rather than an aggregator, colour, a freer licence).
   also (optional): where else in the volume this image is proposed, e.g. "Tittel S3-a".
   pageLabel (optional): the words on the page link when `page` is not the object's own record (default "strona obiektu").
   hint (optional): for MB, in plain words, what `why` points at: the quoted passage or footnote, or where on a page of
   text it stands (column, paragraph, line), when that is not obvious from the thumbnail (SKILL.md step 5).
   rec (optional): the ikonograf's proposal, "1" główne (must go with the text) or "2" dodatkowe (strong reserve).
   pick (optional): MB's choice as recorded from his „Kopiuj wybór” paste: "1", "2", "x" (archiwum) or "0" (no tier).
   notes: § 5 and § 6 of ikonografia.md, put in by the build (never in the rows file); "§ 5" / "§ 6" in a `why` opens them.
   record / toc: ikonografia.md as HTML for the „Zapis” panel, put in by the build. */
const DATA = {
  text: "[Author], „[short title]” ([vol.])",
  note: "Kandydaci [dd.mm.yyyy]. Klasa praw: A wolne · B uznanie autorstwa · C NC/ND · D zgoda · E autor nieznany · F płatne.",
  slots: { "S1": "[idea of slot 1]" },
  notes: {},
  items: [
    { id:"S1-a", slot:"S1", thumb:"", title:"", date:"", creator:"", holder:"", cls:"A", size:"",
      page:"", pageLabel:"", full:"", why:"", hint:"", metryka:"", alt:[], also:"", rec:"", pick:"" }
  ]
};
/* ---- rendering (no edits needed below; no loading="lazy": the app's side panel never loads lazy images) ---- */
const $ = id => document.getElementById(id);
$("h").textContent = DATA.text; $("s").textContent = (DATA.note || "").replace(/\s*(?:Klasa praw|Klasy|Prawa):\s*A wolne.*?płatne\.?/, "");
let only = null, view = "";            /* rights filter; selection view: "" = all but archive, sel, 1, 2, none, x */
const CLS_LABEL = { A:"wolne", B:"uznanie autorstwa", C:"NC / ND", D:"zgoda", E:"autor nieznany", F:"płatne" };
const RFLAG = { D:"wymaga zgody", E:"prawa nieznane", F:"płatne" };
const PL = { "1":"główne", "2":"dodatkowe", "x":"archiwum" };
const NOTES = DATA.notes || {};
const IDS = new Set(DATA.items.map(i => i.id));
const escH = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/* ---- selection state: MB's clicks live in this browser (localStorage), over `pick` (recorded) and `rec` (proposed) ---- */
const SKEY = "srom-kontaktowka:" + (DATA.rid || DATA.text);
let LOCAL = {}, STORE_OK = true;
try { LOCAL = JSON.parse(localStorage.getItem(SKEY) || "{}") || {}; localStorage.setItem(SKEY + ":t", "1"); localStorage.removeItem(SKEY + ":t"); } catch (x) { STORE_OK = false; }
const saveLocal = () => { try { localStorage.setItem(SKEY, JSON.stringify(LOCAL)); } catch (x) { STORE_OK = false; } };
const base = i => (i.pick === "0" ? "" : i.pick) || i.rec || "";
const st = i => (i.id in LOCAL) ? LOCAL[i.id] : base(i);
function setPick(id, p) {
  const i = DATA.items.find(x => x.id === id); if (!i) return;
  const v = st(i) === p ? "" : p;              /* clicking the active tier clears it */
  if (v === base(i)) delete LOCAL[id]; else LOCAL[id] = v;
  saveLocal(); render(true); counts();
  if ($("lb").classList.contains("on")) lbShow(LBI, true);
}
const pkHtml = i => { const s = st(i); return `<span class="pk">` +
  `<button class="p1${s === "1" ? " on" : ""}" data-pid="${i.id}" data-p="1" title="Główne: musi iść z tekstem (klawisz 1 w podglądzie)"><span class="dot p1"></span>główne</button>` +
  `<button class="p2${s === "2" ? " on" : ""}" data-pid="${i.id}" data-p="2" title="Dodatkowe (klawisz 2 w podglądzie)"><span class="dot p2"></span>dodatkowe</button>` +
  `<button class="px${s === "x" ? " on" : ""}" data-pid="${i.id}" data-p="x" title="${s === "x" ? "Przywróć z archiwum" : "Do archiwum: znika z widoku, zostaje w zakładce Archiwum"} (klawisz A w podglądzie)">${s === "x" ? "↩ z archiwum" : "archiwum"}</button></span>`; };
const recNote = i => i.rec && i.rec !== st(i) ? `<span class="recn">propozycja: <span class="dot p${i.rec}"></span>${PL[i.rec]}</span>` : "";
function inView(i) {
  const s = st(i);
  if (only && i.cls !== only) return false;
  if (view === "x") return s === "x";
  if (s === "x") return false;
  if (view === "sel") return s === "1" || s === "2";
  if (view === "1" || view === "2") return s === view;
  if (view === "none") return !s;
  return true;
}
/* rights flag: D, E, F always; C only when no-derivatives (no crop or detail) */
function rflag(i) {
  if (RFLAG[i.cls]) return `<span class="rflag ${i.cls}" title="Klasa ${i.cls}: ${CLS_LABEL[i.cls]}">● ${RFLAG[i.cls]}</span>`;
  if (i.cls === "C" && /(?<!bez |no |without )\bND\b|NoDeriv|-ND\b/.test([i.metryka, i.why, i.holder].join(" "))) return `<span class="rflag C" title="Bez utworów zależnych: nie kadrować">● ND: bez kadrowania</span>`;
  return "";
}
const needs = i => !!rflag(i);
/* "§ 5" / "§ 6" open the record's section; a candidate id on this sheet jumps to it (not one after another author's name) */
function deco(s, i) {
  return String(s || "")
    .replace(/§\s*([56])(?![.\d])/g, (m, n) => NOTES[n] ? `<button class="sec" data-n="${n}" data-id="${i.id}" title="ikonografia.md § ${n}: ${escH(NOTES[n].h || "")}">${m}</button>` : m)
    .replace(/(?<!\p{Lu}\p{Ll}+\s|\)\s)\b([SX]\d+²?-[a-z]{1,2})(?![\p{L}\d])/gu, (m, id) => IDS.has(id) && id !== i.id ? `<a class="jump" href="#" data-j="${id}">${m}</a>` : m);
}
const src = i => (window.MINI || {})[i.thumb] || i.thumb;
const link = (u, t) => u ? `<a href="${u}" target="_blank" rel="noopener noreferrer" title="${u}">${t}</a><button class="cp" data-u="${u}" title="Kopiuj adres">⧉</button>` : "";
let VIS = [];                              /* the visible candidates with a thumbnail, in order: the gallery's sequence */
function render(keep) {
  const y = window.scrollY;
  const out = $("out"); out.innerHTML = ""; VIS = [];
  for (const [slot, idea] of Object.entries(DATA.slots)) {
    const all = DATA.items.filter(i => i.slot === slot);
    const items = all.filter(inView);
    if (!items.length) continue;
    const n1 = all.filter(i => st(i) === "1").length, n2 = all.filter(i => st(i) === "2").length;
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>${slot} <small>${idea}</small>${n1 || n2 ? `<span class="pc">${n1 ? `<span class="dot p1"></span>${n1} ` : ""}${n2 ? `<span class="dot p2"></span>${n2}` : ""}</span>` : ""}</h2>`;
    const g = document.createElement("div"); g.className = "grid";
    for (const i of items) {
      const s = st(i);
      if (i.thumb) VIS.push(i);
      const c = document.createElement("div"); c.className = "c" + (needs(i) ? " need " + i.cls : "") + (s ? " p" + s : ""); c.id = "c-" + i.id;
      const alts = (i.alt || []).map(a => `<div class="alt">Lepsza kopia: ${link(a.url, a.label)}${a.why ? " — " + a.why : ""}</div>`).join("");
      c.innerHTML = `${i.thumb ? `<img src="${src(i)}" alt="" data-id="${i.id}">` : ""}
        <div class="b"><div class="top"><span class="cls" style="background:var(--${i.cls})" title="${CLS_LABEL[i.cls] || ""}">${i.cls}</span><span class="id">${i.id}</span>${rflag(i)}${pkHtml(i)}</div>
        ${recNote(i) ? `<div>${recNote(i)}</div>` : ""}
        <div class="t">${i.page && !i.pageLabel ? link(i.page, i.title) : i.title}</div>
        <div class="m">${[i.date, i.creator].filter(Boolean).join(" · ")}</div>
        <div class="m">${i.holder}${i.size ? " · " + i.size : ""}</div>
        <div class="m">${link(i.page, i.pageLabel || "strona obiektu")}${i.full ? " · " + link(i.full, "pełna rozdzielczość") : ""}</div>
        ${i.why ? `<div class="why">${deco(i.why, i)}</div>` : ""}${i.hint ? `<div class="hint">${deco(i.hint, i)}</div>` : ""}${i.metryka ? `<div class="mt">Metryka (szkic): ${i.metryka}</div>` : ""}${alts}
        ${i.also ? `<div class="also">Też w: ${i.also}</div>` : ""}</div>`;
      g.appendChild(c);
    }
    sec.appendChild(g); out.appendChild(sec);
  }
  if (!out.children.length) out.innerHTML = `<section><p class="m">Nic w tym widoku.</p></section>`;
  if (keep) window.scrollTo(0, y);
}
/* Links: a sandboxed preview (Biurko, chat panel) blocks target=_blank silently. Try a normal open; if blocked, copy the URL and say so. */
function toast(m) {
  let n = $("toast"); if (!n) { n = document.createElement("div"); n.id = "toast";
    n.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font:13px sans-serif;max-width:90vw;word-break:break-all;z-index:99;white-space:pre-line";
    document.body.appendChild(n); }
  n.textContent = m; n.style.display = "block";
  clearTimeout(n.t); n.t = setTimeout(() => n.style.display = "none", 6000);
}
function copy(u) { let ok = false;
  try { const x = document.createElement("textarea"); x.value = u; document.body.appendChild(x); x.select(); ok = document.execCommand("copy"); x.remove(); } catch (x) {}
  if (!ok) try { navigator.clipboard.writeText(u); ok = true; } catch (x) {}
  return ok; }
document.addEventListener("click", e => {
  const pb = e.target.closest && e.target.closest("button[data-pid]");
  if (pb) { e.stopPropagation(); setPick(pb.dataset.pid, pb.dataset.p); return; }
  const cp = e.target.closest && e.target.closest("button.cp");
  if (cp) { e.stopPropagation(); const u = cp.dataset.u;
